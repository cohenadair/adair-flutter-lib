name: adair_flutter_lib
description: "A library for common code used across my apps."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

flutter:
  generate: true

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.19.1                       # https://pub.dev/packages/collection
  cloud_firestore: ^6.5.0                   # https://pub.dev/packages/cloud_firestore
  cloud_functions: ^6.3.2                   # https://pub.dev/packages/cloud_functions
  crypto: ^3.0.6                            # https://pub.dev/packages/crypto
  device_info_plus: ^11.4.0                 # https://pub.dev/packages/device_info_plus
  package_info_plus: ^9.0.1                 # https://pub.dev/packages/package_info_plus
  file_picker: ^10.3.10                     # https://pub.dev/packages/file_picker
  firebase_analytics: ^12.3.0               # https://pub.dev/packages/firebase_analytics
  firebase_auth: ^6.5.1                     # https://pub.dev/packages/firebase_auth
  firebase_core: ^4.9.0                     # https://pub.dev/packages/firebase_core
  firebase_crashlytics: ^5.2.2              # https://pub.dev/packages/firebase_crashlytics
  firebase_storage: ^13.4.2                 # https://pub.dev/packages/firebase_storage
  flutter_local_notifications: ^19.4.1      # https://pub.dev/packages/flutter_local_notifications
  http: ^1.3.0                              # https://pub.dev/packages/http
  in_app_review: ^2.0.6                     # https://pub.dev/packages/in_app_review
  intl: ^0.20.2                             # https://pub.dev/packages/intl
  fixnum: ^1.1.1                            # https://pub.dev/packages/fixnum
  flutter_timezone: ^4.1.0                  # https://pub.dev/packages/flutter_timezone
  meta: ^1.16.0                             # https://pub.dev/packages/meta
  permission_handler: ^11.3.0               # https://pub.dev/packages/permission_handler
  protobuf: ^4.1.0                          # https://pub.dev/packages/protobuf
  purchases_flutter: ^10.1.0                # https://pub.dev/packages/purchases_flutter
  path_provider: ^2.0.11                    # https://pub.dev/packages/path_provider
  flutter_native_splash: ^2.4.8             # https://pub.dev/packages/flutter_native_splash
  quiver: ^3.2.2                            # https://pub.dev/packages/quiver
  shared_preferences: ^2.5.3                # https://pub.dev/packages/shared_preferences
  syncfusion_flutter_core: ^28.2.5          # https://pub.dev/packages/syncfusion_flutter_core
  timezone: ^0.10.0                         # https://pub.dev/packages/timezone

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.4                     # https://pub.dev/packages/build_runner
  flutter_lints: ^6.0.0                     # https://pub.dev/packages/flutter_lints
  mockito: ^5.5.1                           # https://pub.dev/packages/mockito
