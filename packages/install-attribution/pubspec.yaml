name: adair_install_attribution
description: "Opt-in Meta app-install attribution (SKAdNetwork on iOS, Meta SDK on Android)."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  adair_flutter_lib:
    # ignore: invalid_dependency
    path: ../..

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0                     # https://pub.dev/packages/flutter_lints

flutter:
  plugin:
    platforms:
      android:
        package: com.cohenadair.adair_install_attribution
        pluginClass: InstallAttributionPlugin
      ios:
        pluginClass: InstallAttributionPlugin
