group = "com.cohenadair.adair_install_attribution"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.13.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.cohenadair.adair_install_attribution"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    // Meta (Facebook) SDK, used for app-install attribution. Dormant unless an
    // app opts in via InstallAttributionManager; see AndroidManifest.xml.
    // Release notes: https://github.com/facebook/facebook-android-sdk/releases
    implementation "com.facebook.android:facebook-core:18.3.0"
}
